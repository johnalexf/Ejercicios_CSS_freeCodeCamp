<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
  </head>
  <body>
    <main>
      <h1>My To-Do List</h1>

      <ul class="todo-list">

        <li>
          <input type="checkbox" name="gaming" id="gaming" />
          <label for="gaming">Explore gaming keyboards</label>
          <ul class="sub-item">
            <li>
                <a href="https://www.freecodecamp.or" class="sub-item-link" target="_blank">
                    Store link
                </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" name="report" id="report" />
          <label for="report">Finish the report</label>
          <ul class="sub-item">
            <li>
                <a href="https://www.freecodecamp.or" class="sub-item-link" target="_blank">
                    Request Access
                </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" name="phone" id="phone" />
          <label for="phone">View Phone´s Warrantly</label>
          <ul class="sub-item">
            <li>
                <a href="https://www.freecodecamp.or" class="sub-item-link" target="_blank">
                    View Receipts
                </a>
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" name="specs" id="specs" />
          <label for="specs">Check Processor Specs</label>
          <ul class="sub-item">
            <li>
                <a href="https://www.freecodecamp.or" class="sub-item-link" target="_blank">
                    View Model Number
                </a>
            </li>
          </ul>
        </li>

      </ul>
    </main>
  </body>
</html>
