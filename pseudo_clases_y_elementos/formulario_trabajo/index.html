<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Job Application Form</h1>
        <form action="">
            <label for="name">
                Full Name:
            </label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="position">Position:</label>
            <select name="position" id="position" >
                <option value="">Select a position</option>
                <option value="1">Developer</option>
                <option value="2">Designer</option>
                <option value="">Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability:</legend>

                <input type="radio" id="full-time" name="availability"
                checked
                >
                <label for="full-time">Full-time</label>

                <input type="radio" id="part-time" name="availability">
                <label for="part-time">Part-Time</label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea name="message" id="message" placeholder="Write your motivation" rows="6" cols="50"></textarea>

            <button type="submit"> Submit Application </button>
        </form>
    </div>

</body>
</html>
